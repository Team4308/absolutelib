<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vision System | AbsoluteLib V2</title>
    <link rel="stylesheet" href="../styles.css">
    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/atom-one-dark.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
    <script>hljs.highlightAll();</script>
</head>

<body>
    <div class="layout">
        <div id="sidebar-container"></div>
<script src="./sidebar.js"></script>
        <div class="overlay" id="overlay" onclick="toggleSidebar()"></div>
        <main class="main-content">
            <div class="content-container">
                <section id="vision">
                    <h2>Vision System</h2>
                    <p>Seamless integration with PhotonVision and Swerve pose estimation for the 2026 Reefscape.</p>
                    <pre><code class="language-java">Vision vision = new Vision(
    drive::getPose, 
    drive.field, 
    layout, 
    new Vision.VisionCamera("FrontCam", layout, ...)
);

vision.updatePoseEstimation(drive);</code></pre>
                </section>
            </div>
        </main>
    </div>
    <button class="mobile-toggle" onclick="toggleSidebar()">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="3" y1="12" x2="21" y2="12"></line>
            <line x1="3" y1="6" x2="21" y2="6"></line>
            <line x1="3" y1="18" x2="21" y2="18"></line>
        </svg>
    </button>
    <script>
        function toggleSidebar() {
            document.getElementById('sidebar').classList.toggle('open');
            document.getElementById('overlay').classList.toggle('open');
        }
    </script>
</body>

</html>
